[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "microlens-recsys-mvp"
version = "0.0.0"
description = "Contract-first MicroLens recommendation MVP foundation"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
# These are package compatibility declarations. Exact transitive versions and
# hashes are frozen in requirements-api.lock and requirements-dev.lock after the
# successful linux/arm64 Phase 1 build.
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "pyyaml>=6.0,<7.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
