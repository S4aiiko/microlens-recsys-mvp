name: ${COMPOSE_PROJECT_NAME:-microlens-mvp}

# Image digests were frozen after successful linux/arm64 builds/pulls. The
# Elasticsearch server keeps its own Elastic/AGPL/SSPL distribution boundary;
# this repository's application code remains MIT.
x-listener-contract:
  public:
    url: http://api:8000
    host_published: true
    reject_path_prefixes:
      - /internal/
  internal_activation:
    url: http://api:8001
    host_published: false
    network: backend
    authentication: publishToken
    implementation_status: phase_2d_runtime

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARCH_URL: ${SEARCH_URL:-http://search:9200}
      SEARCH_READ_ALIAS: ${SEARCH_READ_ALIAS:-microlens-items-read}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?Set PUBLISH_TOKEN in .env}
      MICROLENS_SEED_PASSWORD: ${MICROLENS_SEED_PASSWORD:?Set MICROLENS_SEED_PASSWORD in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-5}
      REGISTRATION_RATE_WINDOW_SECONDS: ${REGISTRATION_RATE_WINDOW_SECONDS:-300}
      PUBLIC_LISTENER_URL: http://0.0.0.0:8000
      PUBLIC_REJECT_PATH_PREFIXES: /internal/
      INTERNAL_ACTIVATION_LISTENER_URL: http://0.0.0.0:8001
      INTERNAL_ACTIVATION_IMPLEMENTED: "true"
      ALEMBIC_INI: /workspace/apps/api/alembic/alembic.ini
      MODEL_ARTIFACTS_DIR: /artifacts/models
      PROCESSED_DATA_ROOT: /artifacts/processed
      TRAINING_EXPORTS_DIR: /artifacts/training_exports
      ANALYTICS_EXPORTS_DIR: /artifacts/analytics_exports
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/artifacts/models
      - ${PROCESSED_DATA_DIR:-./data/processed}:/artifacts/processed:ro
      - training_exports:/artifacts/training_exports
      - analytics_exports:/artifacts/analytics_exports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edge
      - backend

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-microlens}
      POSTGRES_USER: ${POSTGRES_USER:-microlens_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1@sha256:e1e791f34c85ee79b1fee2f458acf4c19e7f1d47f78efe8805a8a302754f0f9f
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - search_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: foundation
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARCH_URL: ${SEARCH_URL:-http://search:9200}
      SEARCH_READ_ALIAS: ${SEARCH_READ_ALIAS:-microlens-items-read}
      MODEL_ARTIFACTS_DIR: /artifacts/models
      MODEL_ARTIFACT_ROOT: /artifacts/models
      PROCESSED_DATA_ROOT: /artifacts/processed
      WORKER_MODEL_CONFIG: ${WORKER_MODEL_CONFIG:-/workspace/configs/models/smoke-a.json}
      WORKER_TRAINING_HANDLER: apps.worker.model_training:registered_worker_training_handler
      TRAINING_EXPORTS_DIR: /artifacts/training_exports
      ANALYTICS_EXPORTS_DIR: /artifacts/analytics_exports
      WORKER_PORT: "8081"
      WORKER_REQUIRE_TRAINING_HANDLER: "true"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_artifacts:/artifacts/models
      # This bind is intentionally explicit. Compose does not claim that a named
      # volume already contains official processed data or trained models.
      - ${PROCESSED_DATA_DIR:-./data/processed}:/artifacts/processed:ro
      - training_exports:/artifacts/training_exports
      - analytics_exports:/artifacts/analytics_exports
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.app", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "-m", "apps.worker.scheduler", "serve"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARCH_URL: ${SEARCH_URL:-http://search:9200}
      SEARCH_READ_ALIAS: ${SEARCH_READ_ALIAS:-microlens-items-read}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-2}
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-60}
      SCHEDULER_RETRY_DELAY_SECONDS: ${SCHEDULER_RETRY_DELAY_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      search:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  model_artifacts:
  training_exports:
  analytics_exports:
  search_data:

networks:
  edge:
  backend:
    internal: true
